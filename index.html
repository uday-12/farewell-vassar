<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Farewell - Uday Dumma</title>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;

            width: 100%;
            height: 100%;

            background: #000;

            overflow: hidden;
        }


        body {

            font-family:
                "Courier New",
                monospace;

            color: #00ff41;
        }


        /* =====================================================
           TERMINAL
        ===================================================== */

        #terminal {

            position: fixed;

            inset: 0;

            padding: 22px 28px;

            background: #000;

            overflow: hidden;

            font-size: 16px;

            line-height: 1.35;

            text-shadow:
                0 0 4px #00ff41,
                0 0 8px rgba(0, 255, 65, 0.3);
        }


        .terminal-line {

            white-space: nowrap;

            min-height: 21px;
        }


        .warning {

            color: #ffff00;

            text-shadow:
                0 0 5px #ffff00;
        }


        .success {

            color: #00ff41;
        }


        /* =====================================================
           FINAL SCREEN
        ===================================================== */

        #finalScreen {

            display: none;

            position: fixed;

            inset: 0;

            background:

                radial-gradient(
                    circle at 75% 50%,
                    #001a08 0%,
                    #000900 30%,
                    #000000 70%
                );

            overflow: hidden;
        }


        /* =====================================================
           SCAN LINES
        ===================================================== */

        #finalScreen::after {

            content: "";

            position: absolute;

            inset: 0;

            pointer-events: none;

            z-index: 100;

            background:

                repeating-linear-gradient(
                    0deg,
                    rgba(0,255,65,0.025) 0px,
                    rgba(0,255,65,0.025) 1px,
                    transparent 1px,
                    transparent 4px
                );
        }


        /* =====================================================
           THANK YOU
        ===================================================== */

        #thankYou {

            position: absolute;

            left: 6%;

            top: 20%;

            z-index: 20;

            opacity: 0;

            transform:
                translateY(30px);

            transition:

                opacity 2s ease,
                transform 2s ease;
        }


        #thankYou.show {

            opacity: 1;

            transform:
                translateY(0);
        }


        #thankYou h1 {

            margin: 0;

            font-size:
                clamp(
                    48px,
                    5vw,
                    78px
                );

            color: #00ff41;

            letter-spacing: 3px;

            text-shadow:

                0 0 7px #00ff41,
                0 0 18px #00ff41,
                0 0 35px #00ff41;
        }


        #thankYou h2 {

            display: flex;

            align-items: center;

            margin-top: 30px;

            font-size:
                clamp(
                    28px,
                    3vw,
                    45px
                );

            color: white;

            letter-spacing: 2px;

            text-shadow:

                0 0 7px white,
                0 0 18px
                rgba(255,255,255,0.8);
        }


        /* =====================================================
           HEART
        ===================================================== */

        .heart {

            display: inline-block;

            margin-left: 18px;

            color: #ff1744;

            font-family:
                Arial,
                sans-serif;

            font-size: 48px;

            line-height: 1;

            text-shadow:

                0 0 5px #ff1744,
                0 0 12px #ff1744,
                0 0 25px #ff1744,
                0 0 40px
                rgba(255,23,68,0.8);

            animation:
                heartbeat 1.3s infinite;
        }


        @keyframes heartbeat {

            0% {

                transform:
                    scale(1);
            }

            15% {

                transform:
                    scale(1.25);
            }

            30% {

                transform:
                    scale(1);
            }

            45% {

                transform:
                    scale(1.18);
            }

            60% {

                transform:
                    scale(1);
            }

            100% {

                transform:
                    scale(1);
            }
        }


        /* =====================================================
           PHOTO CONTAINER
        ===================================================== */

        #photoContainer {

            position: absolute;

            right: 5%;

            bottom: 7%;

            width:
                min(
                    440px,
                    32vw
                );

            z-index: 10;

            opacity: 0;

            transform:

                translateY(100px)
                scale(0.95);

            transition:

                opacity 2.5s ease,
                transform 2.5s ease;
        }


        #photoContainer.show {

            opacity: 1;

            transform:

                translateY(0)
                scale(1);
        }


        /* =====================================================
           ACTUAL PHOTO
        ===================================================== */

        #udayPhoto {

            display: block;

            width: 100%;

            height: auto;

            max-height: 70vh;

            object-fit: contain;

            border-radius: 10px;

            box-shadow:

                0 0 8px #00ff41,
                0 0 20px
                rgba(0,255,65,0.6),
                0 0 45px
                rgba(0,255,65,0.25);
        }


        /* =====================================================
           FINAL MESSAGE
        ===================================================== */

        #finalMessage {

            position: absolute;

            left: 6%;

            bottom: 13%;

            z-index: 20;

            opacity: 0;

            transform:
                translateY(20px);

            font-size:
                clamp(
                    18px,
                    1.6vw,
                    25px
                );

            line-height: 1.9;

            text-shadow:

                0 0 5px #00ff41,
                0 0 12px
                rgba(0,255,65,0.5);

            transition:

                opacity 2s ease,
                transform 2s ease;
        }


        #finalMessage.show {

            opacity: 1;

            transform:
                translateY(0);
        }


        /* =====================================================
           CURSOR
        ===================================================== */

        .cursor {

            display: inline-block;

            width: 11px;

            height: 22px;

            margin-left: 5px;

            vertical-align: middle;

            background: #00ff41;

            box-shadow:
                0 0 8px #00ff41;

            animation:
                cursorBlink 0.7s infinite;
        }


        @keyframes cursorBlink {

            0%,
            45% {

                opacity: 1;
            }

            46%,
            100% {

                opacity: 0;
            }
        }


        /* =====================================================
           MOBILE
           
           Desktop layout above is unchanged.
        ===================================================== */

        @media (max-width: 900px) {


            html,
            body {

                width: 100%;

                height: 100%;

                max-width: 100%;

                overflow: hidden;
            }


            /* -------------------------------------------------
               TERMINAL
            ------------------------------------------------- */

            #terminal {

                width: 100vw;

                max-width: 100vw;

                height: 100vh;

                padding:
                    12px 14px;

                font-size: 11px;

                line-height: 1.35;

                overflow: hidden;
            }


            .terminal-line {

                width: 100%;

                max-width: 100%;

                overflow: hidden;

                white-space: nowrap;
            }


            /* -------------------------------------------------
               FINAL SCREEN
            ------------------------------------------------- */

            #finalScreen {

                width: 100vw;

                max-width: 100vw;

                height: 100vh;

                overflow: hidden;
            }


            /* -------------------------------------------------
               THANK YOU
            ------------------------------------------------- */

            #thankYou {

                left: 0;

                right: 0;

                top: 5%;

                width: 100%;

                padding:
                    0 12px;

                text-align: center;

                transform:
                    translateY(30px);
            }


            #thankYou.show {

                transform:
                    translateY(0);
            }


            #thankYou h1 {

                width: 100%;

                margin: 0;

                font-size:
                    clamp(
                        30px,
                        8vw,
                        48px
                    );

                line-height: 1.15;

                letter-spacing: 1px;

                white-space: nowrap;
            }


            #thankYou h2 {

                display: flex;

                justify-content: center;

                align-items: center;

                width: 100%;

                margin:
                    14px 0 0;

                font-size:
                    clamp(
                        19px,
                        5.5vw,
                        32px
                    );

                line-height: 1.2;

                letter-spacing: 0;

                white-space: nowrap;
            }


            /* -------------------------------------------------
               MOBILE HEART
            ------------------------------------------------- */

            .heart {

                flex-shrink: 0;

                margin-left: 9px;

                font-size:
                    clamp(
                        28px,
                        8vw,
                        42px
                    );

                line-height: 1;

                text-shadow:

                    0 0 5px #ff1744,
                    0 0 12px #ff1744,
                    0 0 25px #ff1744;
            }


            /* -------------------------------------------------
               PHOTO
               
               Centered and limited in height.
            ------------------------------------------------- */

            #photoContainer {

                position: absolute;

                left: 50%;

                right: auto;

                top: 25%;

                bottom: auto;

                width: 68vw;

                max-width: 320px;

                height: 45vh;

                max-height: 45vh;

                display: flex;

                justify-content: center;

                align-items: center;

                opacity: 0;

                transform:

                    translateX(-50%)
                    translateY(60px)
                    scale(0.95);

                transition:

                    opacity 2.5s ease,
                    transform 2.5s ease;
            }


            #photoContainer.show {

                left: 50%;

                top: 25%;

                bottom: auto;

                transform:

                    translateX(-50%)
                    translateY(0)
                    scale(1);

                opacity: 1;
            }


            /* -------------------------------------------------
               IMAGE
            ------------------------------------------------- */

            #udayPhoto {

                display: block;

                width: auto;

                max-width: 100%;

                height: auto;

                max-height: 42vh;

                object-fit: contain;

                border-radius: 8px;

                box-shadow:

                    0 0 8px #00ff41,
                    0 0 18px
                    rgba(0,255,65,0.6),
                    0 0 35px
                    rgba(0,255,65,0.25);
            }


            /* -------------------------------------------------
               FINAL MESSAGE
               
               Always visible at bottom.
            ------------------------------------------------- */

            #finalMessage {

                position: absolute;

                left: 0;

                right: 0;

                bottom: 3%;

                width: 100%;

                padding:
                    0 10px;

                text-align: center;

                font-size:
                    clamp(
                        11px,
                        3.2vw,
                        17px
                    );

                line-height: 1.65;

                white-space: normal;

                overflow: visible;

                opacity: 0;

                transform:
                    translateY(20px);
            }


            #finalMessage.show {

                opacity: 1;

                transform:
                    translateY(0);
            }


            /* -------------------------------------------------
               CURSOR
            ------------------------------------------------- */

            .cursor {

                width: 8px;

                height: 15px;

                margin-left: 3px;
            }

        }


        /* =====================================================
           SMALL PHONES
        ===================================================== */

        @media (max-width: 400px) {


            #thankYou {

                top: 4%;

                padding:
                    0 8px;
            }


            #thankYou h1 {

                font-size: 28px;

                letter-spacing: 0;
            }


            #thankYou h2 {

                margin-top: 10px;

                font-size: 19px;
            }


            .heart {

                font-size: 27px;

                margin-left: 7px;
            }


            #photoContainer {

                top: 24%;

                width: 62vw;

                max-width: 250px;

                height: 44vh;

                max-height: 44vh;
            }


            #photoContainer.show {

                top: 24%;
            }


            #udayPhoto {

                max-height: 40vh;

                max-width: 100%;
            }


            #finalMessage {

                bottom: 2%;

                padding:
                    0 8px;

                font-size: 10px;

                line-height: 1.5;
            }

        }


        /* =====================================================
           EXTRA SMALL PHONES
        ===================================================== */

        @media (max-width: 360px) {


            #thankYou h1 {

                font-size: 25px;
            }


            #thankYou h2 {

                font-size: 17px;
            }


            .heart {

                font-size: 24px;
            }


            #photoContainer {

                top: 23%;

                width: 58vw;

                max-width: 220px;

                height: 43vh;
            }


            #udayPhoto {

                max-height: 38vh;
            }


            #finalMessage {

                bottom: 2%;

                font-size: 9px;

                line-height: 1.4;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         HACKER TERMINAL
    ===================================================== -->

    <div id="terminal"></div>



    <!-- =====================================================
         FINAL SCREEN
    ===================================================== -->

    <div id="finalScreen">


        <!-- ================================================
             THANK YOU MESSAGE
        ================================================= -->

        <div id="thankYou">

            <h1>
                Thank You Vassar
            </h1>


            <h2>

                From Uday Dumma

                <span class="heart">
                    ♥
                </span>

            </h2>

        </div>



        <!-- ================================================
             UDAY PHOTO

             The browser loads this directly from:
             ./uday_profile.png
        ================================================= -->

        <div id="photoContainer">

            <img
                id="udayPhoto"
                src="./uday_profile.png"
                alt="Uday Dumma"
            >

        </div>



        <!-- ================================================
             FINAL MESSAGE
        ================================================= -->

        <div id="finalMessage">

            [ MEMORIES SAVED SUCCESSFULLY ]

            <br>

            [ CONNECTION CLOSED ]

            <br>

            GOODBYE VASSAR

            <span class="cursor"></span>

        </div>


    </div>



    <script>


        /* =====================================================
           ELEMENTS
        ===================================================== */

        const terminal =
            document.getElementById(
                "terminal"
            );


        const finalScreen =
            document.getElementById(
                "finalScreen"
            );


        const thankYou =
            document.getElementById(
                "thankYou"
            );


        const photoContainer =
            document.getElementById(
                "photoContainer"
            );


        const udayPhoto =
            document.getElementById(
                "udayPhoto"
            );


        const finalMessage =
            document.getElementById(
                "finalMessage"
            );



        /* =====================================================
           PHOTO CHECK
        ===================================================== */

        udayPhoto.onload =
            function () {

                console.log(
                    "Uday photo loaded successfully."
                );

            };


        udayPhoto.onerror =
            function () {

                console.error(
                    "ERROR: uday_profile.png was not found."
                );

            };



        /* =====================================================
           SYSTEM NAMES
        ===================================================== */

        const systems = [

            "VASSAR_CORE",

            "JAVA_RUNTIME",

            "SPRING_BOOT",

            "ANGULAR_ENGINE",

            "DATABASE_NODE",

            "API_GATEWAY",

            "AUTH_SERVICE",

            "PROJECT_SERVER",

            "MEMORY_CLUSTER",

            "DEVOPS_NODE",

            "PRODUCTION_SERVER",

            "SECURITY_LAYER",

            "USER_SERVICE",

            "NOTIFICATION_ENGINE"

        ];



        /* =====================================================
           HACKER ACTIONS
        ===================================================== */

        const actions = [

            "Initializing connection",

            "Scanning network",

            "Analyzing packets",

            "Accessing server",

            "Decrypting data",

            "Loading modules",

            "Synchronizing database",

            "Checking dependencies",

            "Compiling source",

            "Executing command",

            "Reading system logs",

            "Generating secure token",

            "Establishing connection",

            "Validating credentials",

            "Processing request",

            "Querying database",

            "Fetching records",

            "Analyzing system",

            "Loading memory blocks",

            "Archiving project data",

            "Scanning project files",

            "Checking deployment status",

            "Synchronizing services",

            "Loading environment variables",

            "Checking API connections",

            "Validating database connection",

            "Preparing memory archive"

        ];



        /* =====================================================
           RANDOM HEX
        ===================================================== */

        function randomHex() {

            return Math
                .random()
                .toString(16)
                .substring(2, 10)
                .toUpperCase();

        }



        /* =====================================================
           RANDOM NUMBER
        ===================================================== */

        function randomNumber() {

            return Math.floor(
                Math.random() * 999999
            );

        }



        /* =====================================================
           RANDOM PERCENTAGE
        ===================================================== */

        function randomPercentage() {

            return Math.floor(
                Math.random() * 100
            );

        }



        /* =====================================================
           RANDOM IP
        ===================================================== */

        function randomIP() {

            return (

                Math.floor(
                    Math.random() * 255
                ) +

                "." +

                Math.floor(
                    Math.random() * 255
                ) +

                "." +

                Math.floor(
                    Math.random() * 255
                ) +

                "." +

                Math.floor(
                    Math.random() * 255
                )

            );

        }



        /* =====================================================
           GENERATE HACKER LINE
        ===================================================== */

        function generateLine() {

            const type =
                Math.floor(
                    Math.random() * 9
                );


            if (type === 0) {

                return {

                    text:

                        "[SYSTEM] " +

                        actions[
                            Math.floor(
                                Math.random() *
                                actions.length
                            )
                        ] +

                        " " +

                        systems[
                            Math.floor(
                                Math.random() *
                                systems.length
                            )
                        ],

                    className: ""

                };

            }


            if (type === 1) {

                return {

                    text:

                        "PACKET_" +

                        randomNumber() +

                        " SRC=" +

                        randomIP() +

                        " DST=" +

                        randomIP() +

                        " STATUS=ENCRYPTED",

                    className: ""

                };

            }


            if (type === 2) {

                return {

                    text:

                        "MEMORY 0x" +

                        randomHex() +

                        " 0x" +

                        randomHex() +

                        " 0x" +

                        randomHex(),

                    className: ""

                };

            }


            if (type === 3) {

                return {

                    text:

                        "PROCESS_" +

                        randomNumber() +

                        " PID=" +

                        randomNumber() +

                        " CPU=" +

                        randomPercentage() +

                        "% MEM=" +

                        randomPercentage() +

                        "% STATUS=RUNNING",

                    className: ""

                };

            }


            if (type === 4) {

                return {

                    text:

                        ">>> SEARCHING NODE_" +

                        randomHex() +

                        " ... ACCESS GRANTED",

                    className:
                        "success"

                };

            }


            if (type === 5) {

                return {

                    text:

                        "DATABASE_QUERY_" +

                        randomNumber() +

                        " ROWS=" +

                        randomNumber() +

                        " TIME=" +

                        Math.floor(
                            Math.random() * 500
                        ) +

                        "ms",

                    className: ""

                };

            }


            if (type === 6) {

                return {

                    text:

                        "SECURITY_LAYER_" +

                        randomNumber() +

                        " TOKEN=" +

                        randomHex() +

                        " STATUS=VERIFIED",

                    className:
                        "warning"

                };

            }


            if (type === 7) {

                return {

                    text:

                        "API_REQUEST_" +

                        randomNumber() +

                        " RESPONSE=200 LATENCY=" +

                        Math.floor(
                            Math.random() * 400
                        ) +

                        "ms",

                    className:
                        "success"

                };

            }


            return {

                text:

                    "DEPLOYMENT_NODE_" +

                    randomNumber() +

                    " BUILD=" +

                    randomHex() +

                    " STATUS=SUCCESS",

                className:
                    "success"

            };

        }



        /* =====================================================
           ADD TERMINAL LINE
        ===================================================== */

        function addLine(
            text,
            className = ""
        ) {

            const line =
                document.createElement(
                    "div"
                );


            line.className =
                "terminal-line";


            if (className) {

                line.classList.add(
                    className
                );

            }


            line.textContent =
                text;


            terminal.appendChild(
                line
            );


            /*
             * Keep the screen filled,
             * while old lines disappear.
             */

            while (
                terminal.children.length > 45
            ) {

                terminal.removeChild(
                    terminal.firstChild
                );

            }

        }



        /* =====================================================
           INTRO
        ===================================================== */

        const intro = [

            "==============================================================",

            "VASSAR FAREWELL PROTOCOL v2026.08",

            "==============================================================",

            "",

            "BOOTING VASSAR CORE SYSTEM...",

            "Initializing terminal...",

            "Loading developer profile...",

            "Connecting to VASSAR CORE...",

            "Establishing secure connection...",

            "AUTHENTICATION SUCCESSFUL",

            "",

            "USER: UDAY_DUMMA",

            "ACCESS LEVEL: DEVELOPER",

            "",

            "Scanning project memories...",

            "Scanning source repositories...",

            "Checking deployments...",

            "Checking database connections...",

            "Checking application services...",

            "",

            "WARNING: FAREWELL SEQUENCE DETECTED...",

            "",

            "Preparing memory archive...",

            "Preparing project archive...",

            "Preparing friendship archive...",

            "",

            "STARTING FAREWELL PROTOCOL..."

        ];


        let introIndex = 0;



        /* =====================================================
           SHOW INTRO
        ===================================================== */

        function showIntro() {

            if (
                introIndex <
                intro.length
            ) {

                addLine(
                    intro[introIndex]
                );


                introIndex++;


                setTimeout(
                    showIntro,
                    110
                );

            }

            else {

                startHacking();

            }

        }



        /* =====================================================
           400 HACKER LINES
        ===================================================== */

        let lineCount = 0;



        function startHacking() {

            if (
                lineCount < 400
            ) {

                const generated =
                    generateLine();


                addLine(

                    generated.text,

                    generated.className

                );


                lineCount++;


                setTimeout(

                    startHacking,

                    Math.random() * 25 + 12

                );

            }

            else {

                shutdownSequence();

            }

        }



        /* =====================================================
           SHUTDOWN SEQUENCE
        ===================================================== */

        function shutdownSequence() {

            terminal.innerHTML = "";


            const shutdownLines = [

                "",

                "==============================================================",

                "VASSAR FAREWELL PROTOCOL",

                "==============================================================",

                "",

                "SYSTEM SHUTDOWN INITIATED...",

                "",

                "Saving source code................ COMPLETE",

                "Saving project memories........... COMPLETE",

                "Saving friendships................ COMPLETE",

                "Saving late night deployments..... COMPLETE",

                "Saving countless bugs............. COMPLETE",

                "Saving countless cups of coffee... COMPLETE",

                "",

                "Compiling memories................ OK",

                "Archiving conversations........... OK",

                "Archiving achievements............ OK",

                "Archiving laughter................ OK",

                "",

                "MEMORY ARCHIVE COMPLETE",

                "",

                "Closing active sessions........... OK",

                "Closing database connection....... OK",

                "Closing VASSAR connection......... OK",

                "",

                "FINAL SYSTEM SHUTDOWN IN",

                "",

                "3",

                "",

                "2",

                "",

                "1",

                "",

                "GOODBYE VASSAR..."

            ];


            let index = 0;



            function nextShutdownLine() {

                if (
                    index <
                    shutdownLines.length
                ) {

                    addLine(
                        shutdownLines[index]
                    );


                    index++;


                    setTimeout(
                        nextShutdownLine,
                        420
                    );

                }

                else {

                    setTimeout(
                        showFinalScreen,
                        1500
                    );

                }

            }


            nextShutdownLine();

        }



        /* =====================================================
           FINAL SCREEN
        ===================================================== */

        function showFinalScreen() {


            /*
             * Hide terminal.
             */

            terminal.style.display =
                "none";


            /*
             * Show final screen.
             */

            finalScreen.style.display =
                "block";


            /*
             * Show Thank You.
             */

            setTimeout(
                function () {

                    thankYou.classList.add(
                        "show"
                    );

                },
                500
            );


            /*
             * Show Uday photo.
             */

            setTimeout(
                function () {

                    photoContainer.classList.add(
                        "show"
                    );

                },
                2500
            );


            /*
             * Show final status.
             */

            setTimeout(
                function () {

                    finalMessage.classList.add(
                        "show"
                    );

                },
                4500
            );

        }



        /* =====================================================
           START EVERYTHING
        ===================================================== */

        showIntro();

    </script>

</body>

</html>
